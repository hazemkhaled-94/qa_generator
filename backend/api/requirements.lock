# Generated, not hand-edited. Every version the image actually resolved,
# frozen from the built container with `pip freeze`.
#
# requirements.txt beside this file is the input: the handful of direct
# dependencies with the ranges we accept. This is the output: the exact set,
# transitive packages included, that the image installs. Without it two
# builds a month apart were two different images - poetry.lock pins the host
# and nothing else, and the container never read it.
#
# Regenerate after changing requirements.txt:
#   make lock
#
# That builds the Dockerfile's `resolve` stage, which installs the ranges
# from requirements.txt and freezes what they came to. Rebuilding the api
# image cannot do it: the runtime stage installs this file and never reads
# requirements.txt, so a new dependency would never reach pip. The build
# refuses a lock that does not pin everything requirements.txt declares.
#
# Platform-specific: resolved for linux/aarch64, Python 3.13. A build for
# another platform needs its own regeneration. `make lock` resolves inside
# the image, so it is right wherever it is run from.
#
# torch and torchvision are +cpu builds; they resolve only from
# https://download.pytorch.org/whl/cpu.

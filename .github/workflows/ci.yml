name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A push over a push cancels the older one, which is
# otherwise twenty minutes of a runner testing a commit nobody has now.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Installs once and fills the cache the rest restore. Without it all four
  # jobs below install in parallel on a cold cache, each pulling the same
  # 77 MB of spaCy pipelines from GitHub's release downloads at the same
  # moment - which answered 504 to two of them on the first run - and then
  # three of the four throw their work away, because only one save of a
  # given key wins.
  setup:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

  # Ruff, pyright and the drift gates: the settings every module reads
  # against the files that declare them, the migration chain, the extensions
  # the schema needs, and the locks against what they are built from.
  static:
    name: Static
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make lint
      # Named as their own steps rather than left to tests/static, so a
      # broken contract or a dead dependency reads as itself in the job
      # summary instead of as one failing test among six hundred.
      - run: make lint-imports
      - run: make deps
      # Measured too: the pinned-surface gates import the app and every
      # service to read them, and the combined figure is short by that
      # much without this third share of it.
      - run: poetry run pytest tests/static --cov --cov-report= --cov-fail-under=0
      # Named for the job: pytest-cov combines its own workers into one
      # `.coverage`, so three artifacts of that name would overwrite each
      # other on the way back down rather than combine.
      - name: Keep this job's share of the coverage
        run: mv .coverage .coverage.static
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-static
          path: .coverage.static
          include-hidden-files: true
          retention-days: 1

  # Everything that needs neither a container nor a served model: the unit
  # layers, the properties, the contract shapes and the Streamlit pages.
  unit:
    name: Unit
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache the chunker's tokenizer
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-multilingual-e5-large
      # HYPOTHESIS_PROFILE: 200 examples where a laptop runs 25. See the
      # profiles in tests/conftest.py.
      - run: >-
          poetry run pytest
          -m "not integration and not smoke and not eval and not perf"
          --ignore=tests/static --cov --cov-report= --cov-fail-under=0
        env:
          HYPOTHESIS_PROFILE: ci
      # Named for the job: pytest-cov combines its own workers into one
      # `.coverage`, so three artifacts of that name would overwrite each
      # other on the way back down rather than combine.
      - name: Keep this job's share of the coverage
        run: mv .coverage .coverage.unit
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 1

  # Postgres and SeaweedFS, started by testcontainers against the runner's
  # own Docker. Includes the API, the contract and the end-to-end layers,
  # all of which are marked integration.
  integration:
    name: Integration
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache the chunker's tokenizer
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-multilingual-e5-large
      - name: Pull the images the fixtures start
        run: |
          docker pull pgvector/pgvector:pg18
          docker pull chrislusf/seaweedfs:4.44
      - run: poetry run pytest -m integration --cov --cov-report= --cov-fail-under=0
        env:
          HYPOTHESIS_PROFILE: ci
      # Named for the job: pytest-cov combines its own workers into one
      # `.coverage`, so three artifacts of that name would overwrite each
      # other on the way back down rather than combine.
      - name: Keep this job's share of the coverage
        run: mv .coverage .coverage.integration
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          retention-days: 1

  # Builds both images and looks inside them. Minutes rather than seconds,
  # because the backend image installs torch - but it is the only layer that
  # can see what an image contains, and a lock that does not install is not
  # worth finding out about after the merge.
  smoke:
    name: Smoke
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The backend image is torch-sized and a runner has about 14 GB free.
      - name: Make room for the images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: ./.github/actions/setup
      - run: make test-smoke

  # The two halves put together. Neither job covers the other's: the
  # repositories are the integration layer's and the gates are the unit
  # layer's, so a threshold against either alone is against the wrong
  # number. The floor is [tool.coverage.report] fail_under in pyproject.
  coverage:
    name: Coverage
    needs: [static, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: poetry run coverage combine
      - run: poetry run coverage report
      - name: Put the figure in the job summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            poetry run coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # One job for a branch protection rule to require, so adding a job above
  # does not mean editing the rule.
  gate:
    name: All gates
    if: always()
    needs: [setup, static, unit, integration, smoke, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Report which gates did not pass
        run: |
          echo "setup:       ${{ needs.setup.result }}"
          echo "static:      ${{ needs.static.result }}"
          echo "unit:        ${{ needs.unit.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "smoke:       ${{ needs.smoke.result }}"
          echo "coverage:    ${{ needs.coverage.result }}"
          [ "${{ needs.setup.result }}" = "success" ] \
            && [ "${{ needs.static.result }}" = "success" ] \
            && [ "${{ needs.unit.result }}" = "success" ] \
            && [ "${{ needs.integration.result }}" = "success" ] \
            && [ "${{ needs.smoke.result }}" = "success" ] \
            && [ "${{ needs.coverage.result }}" = "success" ]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A push over a push cancels the older one, which is
# otherwise twenty minutes of a runner testing a commit nobody has now.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Installs once and fills the cache the rest restore. Without it all four
  # jobs below install in parallel on a cold cache, each pulling the same
  # 77 MB of spaCy pipelines from GitHub's release downloads at the same
  # moment - which answered 504 to two of them on the first run - and then
  # three of the four throw their work away, because only one save of a
  # given key wins.
  setup:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

  # Ruff, pyright and the drift gates: the settings every module reads
  # against the files that declare them, the migration chain, the extensions
  # the schema needs, and the locks against what they are built from.
  static:
    name: Static
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make lint
      - run: poetry run pytest tests/static

  # Everything that needs neither a container nor a served model: the unit
  # layers, the properties, the contract shapes and the Streamlit pages.
  unit:
    name: Unit
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache the chunker's tokenizer
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-multilingual-e5-large
      - run: >-
          poetry run pytest -m "not integration and not smoke and not eval"
          --ignore=tests/static

  # Postgres and SeaweedFS, started by testcontainers against the runner's
  # own Docker. Includes the API, the contract and the end-to-end layers,
  # all of which are marked integration.
  integration:
    name: Integration
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache the chunker's tokenizer
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-multilingual-e5-large
      - name: Pull the images the fixtures start
        run: |
          docker pull pgvector/pgvector:pg18
          docker pull chrislusf/seaweedfs:4.44
      - run: poetry run pytest -m integration

  # Builds both images and looks inside them. Minutes rather than seconds,
  # because the backend image installs torch - but it is the only layer that
  # can see what an image contains, and a lock that does not install is not
  # worth finding out about after the merge.
  smoke:
    name: Smoke
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The backend image is torch-sized and a runner has about 14 GB free.
      - name: Make room for the images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: ./.github/actions/setup
      - run: make test-smoke

  # One job for a branch protection rule to require, so adding a job above
  # does not mean editing the rule.
  gate:
    name: All gates
    if: always()
    needs: [setup, static, unit, integration, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Report which gates did not pass
        run: |
          echo "setup:       ${{ needs.setup.result }}"
          echo "static:      ${{ needs.static.result }}"
          echo "unit:        ${{ needs.unit.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "smoke:       ${{ needs.smoke.result }}"
          [ "${{ needs.setup.result }}" = "success" ] \
            && [ "${{ needs.static.result }}" = "success" ] \
            && [ "${{ needs.unit.result }}" = "success" ] \
            && [ "${{ needs.integration.result }}" = "success" ] \
            && [ "${{ needs.smoke.result }}" = "success" ]

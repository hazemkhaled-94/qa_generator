# One palette per theme, and nothing forcing either.
#
# Streamlit picks between [theme.light] and [theme.dark] from the browser's
# prefers-color-scheme, or from whatever the reader chose in the toolbar
# menu, and records the choice per page in localStorage. Either way it sets
# `color-scheme` on the app container to the theme it settled on, and
# styles.css reads its own palette off that with light-dark(), so the custom
# styling follows the chrome however the chrome was decided.
#
# `base` is deliberately unset, and no colour is written in [theme] itself.
# Both apply to light and dark alike, which is exactly what pinned this app
# to light: a white backgroundColor in [theme] is white in dark mode too.
# Only what genuinely does not vary belongs here.

[theme]
font = "sans serif"

[theme.light]
primaryColor = "#A100FF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F2F9"
textColor = "#1A1A1A"
borderColor = "#E6E1EC"

# Near-black carrying the same violet cast as the brand, rather than a
# neutral grey: the accent is #A100FF, and a cool background keeps it from
# reading as the only coloured thing on the page. The primary is lifted,
# because #A100FF on a dark ground is too close to the background to serve
# as an accent.
[theme.dark]
primaryColor = "#B77DFF"
backgroundColor = "#131019"
secondaryBackgroundColor = "#1E1A29"
textColor = "#E9E6F0"
borderColor = "#332C45"

[server]
headless = true
runOnSave = true
maxUploadSize = 100
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# "viewer", not "minimal": minimal hides the toolbar menu altogether, and the
# theme toggle lives in it. Viewer keeps that and the print and screen-record
# items while dropping rerun, clear-cache and deploy, which are a developer's
# and not a reader's.
toolbarMode = "viewer"
showErrorDetails = "none"

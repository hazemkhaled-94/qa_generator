# 2025 theme.
#
# Theme colours: #A100FF core purple, #460073 and #7500C0 deeps, #C2A3FF and
# #E6DCFF lights, #FF50A0 / #224BFF / #05F2DB secondaries, black and white
# grounds, neutral greys.
#
# Streamlit picks between [theme.light] and [theme.dark] from the browser's
# prefers-color-scheme or the toolbar menu, and sets `color-scheme` on the app
# container to the one it settled on. styles.css reads its own palette off that
# with light-dark().
#
# Anything written in [theme] itself applies to both.

[theme]
# Graphik is licensed. Arial is the substitute the brand names; a local
# Graphik is picked up ahead of it.
font = "Graphik, Graphik Regular, Arial, Helvetica, sans-serif"
headingFont = "Graphik Semibold, Graphik, Arial, Helvetica, sans-serif"
headingFontWeights = [700, 700, 600, 600, 600, 600]
# Square. Nothing in the template has a rounded corner.
baseRadius = "none"
buttonRadius = "none"
metricValueFontWeight = 700
showSidebarBorder = true

# White ground.
[theme.light]
primaryColor = "#A100FF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
textColor = "#000000"
borderColor = "#E4E7E7"
linkColor = "#7500C0"
dataframeHeaderBackgroundColor = "#FFFFFF"
dataframeBorderColor = "#E4E7E7"

# Black panel beside white content: the template's split layout.
[theme.light.sidebar]
primaryColor = "#C2A3FF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1A1A1A"
textColor = "#FFFFFF"
borderColor = "#333333"
linkColor = "#C2A3FF"

# Black ground. The core purple is too close to it to carry an accent, so the
# light purple takes over.
[theme.dark]
primaryColor = "#C2A3FF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#121212"
textColor = "#FFFFFF"
borderColor = "#333333"
linkColor = "#C2A3FF"
dataframeHeaderBackgroundColor = "#000000"
dataframeBorderColor = "#333333"

[server]
headless = true
runOnSave = true
maxUploadSize = 100
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

# 2025 theme.
#
# Theme colours: #A100FF core purple, #460073 and #7500C0 deeps, #C2A3FF and
# #E6DCFF lights, #FF50A0 / #224BFF / #05F2DB secondaries, neutral greys.
#
# The template's content slides are white with black type and purple carrying
# the structure: filled table headers, deep purple figures, purple section
# headings. The black slides are covers and dividers, which an application
# does not have.
#
# Streamlit picks between [theme.light] and [theme.dark] from the browser's
# prefers-color-scheme or the toolbar menu, and sets `color-scheme` on the app
# container to the one it settled on. styles.css reads its own palette off that
# with light-dark().

[theme]
# Graphik is licensed. Arial is the substitute the brand names; a local
# Graphik is picked up ahead of it.
font = "Graphik, Graphik Regular, Arial, Helvetica, sans-serif"
headingFont = "Graphik Semibold, Graphik, Arial, Helvetica, sans-serif"
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
metricValueFontWeight = 700
showSidebarBorder = true

[theme.light]
primaryColor = "#A100FF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F4FB"
textColor = "#1A1A1A"
borderColor = "#E4E1EA"
linkColor = "#7500C0"
# The template's table, in its light-header variant. The grid draws its
# header text on a canvas, so the fill has to be one the text reads on and
# no stylesheet can correct it.
dataframeHeaderBackgroundColor = "#E6DCFF"
dataframeBorderColor = "#E4E1EA"

# The deep end of the brand's purple ramp, which is the colour the rule under
# the masthead starts from. Holds the navigation and nothing else.
[theme.light.sidebar]
backgroundColor = "#460073"
secondaryBackgroundColor = "#5B1094"
textColor = "#FFFFFF"
primaryColor = "#C2A3FF"
borderColor = "#6D2A9E"
linkColor = "#C2A3FF"

# Near-black carrying the brand's violet cast, rather than the flat black of
# a cover slide. The core purple is too close to a dark ground to carry an
# accent, so the light purple takes over.
[theme.dark]
primaryColor = "#C2A3FF"
backgroundColor = "#16121D"
secondaryBackgroundColor = "#1F1A2A"
textColor = "#EDEAF2"
borderColor = "#332C45"
linkColor = "#C2A3FF"
dataframeHeaderBackgroundColor = "#2E1A45"
dataframeBorderColor = "#332C45"

# The same purple, which sits above the page rather than under it here.
[theme.dark.sidebar]
backgroundColor = "#340056"
secondaryBackgroundColor = "#48117A"
textColor = "#EDEAF2"
primaryColor = "#C2A3FF"
borderColor = "#54218A"
linkColor = "#C2A3FF"

[server]
headless = true
runOnSave = true
maxUploadSize = 100
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

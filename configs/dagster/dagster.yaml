# Dagster instance configuration.
# Mounted read-only into DAGSTER_HOME (/opt/dagster/dagster_home) in compose.yaml.
# Connection values are injected from the environment — no secrets in this file.
#
# The host and port are read from the environment like the rest, because this
# one file serves two callers that reach the same database at two addresses:
# the containers over the compose network as `postgres:5432`, and
# `make dagster-dev` on the host as `localhost:${POSTGRES_PORT}`. Hard-coded
# to the first, `dagster dev` could not connect and said only that it had
# timed out.

storage:
  postgres:
    postgres_db:
      username:
        env: DAGSTER_DB_USER
      password:
        env: DAGSTER_DB_PASSWORD
      hostname:
        env: DAGSTER_DB_HOST
      db_name:
        env: DAGSTER_DB_NAME
      port:
        env: DAGSTER_DB_PORT

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

# One corpus run at a time, enforced where every launcher has to pass.
#
# The `corpus` job drives the stage queues in order, so two of them racing
# through the same queues interleave: one can ask for a topic fit while the
# other is still draining extraction, and the fit then describes half a
# corpus. The API refuses a second run with a 409, but that check reads the
# run list and then launches - two requests can pass it together - and it is
# not on the path at all for `make pipeline`, for `dagster job launch`, or
# for the Materialize button in Dagster's own UI.
#
# Queued rather than refused, which is the difference between this and the
# 409: a second run waits for the first instead of being turned away. The
# default coordinator submits immediately and imposes no limit.
#
# Needs the daemon, which is already what ticks the schedule and the sensors.
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1

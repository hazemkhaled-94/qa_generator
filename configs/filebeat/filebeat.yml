# Reads the JSON lines this project's processes write and puts each one in
# Elasticsearch. Two places, because a stage runs in two:
#
#   /var/log/qa       the `logs` volume - the api, the five workers, the
#                     frontend and the orchestrator
#   /var/log/qa-host  ./logs in the repository, bind-mounted - a `make`
#                     target, `dagster dev`, anything run by hand
#
# One input over both. The line is the same line either way: same ECS
# fields, same `trace.id`, same `stage`. What says which is which is
# `host.name` - a container id on one side and a machine name on the
# other - so a dashboard groups them together by default and can separate
# them when somebody asks.
#
# Only this project's own processes. The infrastructure containers - Postgres,
# SeaweedFS, Redis, Elasticsearch itself - keep the json-file driver and are
# read with `make logs`. Collecting those too would mean reaching the engine's
# own log store, whose location differs between Docker and Podman and, on
# macOS, sits inside a virtual machine the bind mount cannot see. A second
# input here is all it would take once that path is known for one machine.
#
# Nothing is transformed on the way through: the application already writes
# ECS field names, so Elasticsearch's own template maps `log.level` and
# `service.name` as keywords with nothing configured here.

filebeat.inputs:
  - type: filestream
    id: qa-generator
    enabled: true
    paths:
      - /var/log/qa/*.log
      - /var/log/qa-host/*.log
    parsers:
      # One JSON object per line, merged into the event root rather than
      # nested under a key. overwrite_keys is what lets the line's own
      # @timestamp stand: without it every event is dated when it was read,
      # which for a worker that has been down is hours wrong.
      - ndjson:
          target: ""
          overwrite_keys: true
          expand_keys: true
          add_error_key: true
    # One file per process, and a file stops being written the moment that
    # process ends - which for a `make` target is seconds. Long enough that
    # a stopped worker's last lines, and a host command run while the stack
    # was down, are both still picked up on the next start.
    #
    # These age the REGISTRY, not the disk. `make logs-prune` is what
    # deletes a file.
    ignore_older: 72h
    clean_inactive: 96h

  # Everything that is not this project's own code: postgres, redis,
  # seaweedfs, elasticsearch, phoenix, grafana, argilla, dagster. They
  # write no JSON and know nothing of ECS, so compose points their
  # logging driver here instead and the tag carries the container name.
  #
  # Over the engine's file store because that store is a different path
  # under Docker and Podman and, on macOS, inside a virtual machine no
  # bind mount can see. A UDP port is the one address all three share.
  - type: syslog
    id: qa-infrastructure
    enabled: true
    format: rfc3164
    protocol.udp:
      host: "0.0.0.0:9000"
    fields_under_root: true
    fields:
      # No run wrote these, and the field must be present on every line or
      # a panel filtering on it drops them.
      run.id: ""

processors:
  # The container name, as `tag` on the logging driver spells it, becomes
  # the name every other line is grouped by - reduced to the service, so
  # `/qa_generator-postgres-1` groups beside `extraction` rather than
  # under a name carrying the project and the replica.
  - if:
      has_fields: ["process.name"]
    then:
      - copy_fields:
          fields:
            - from: "process.name"
              to: "service.name"
          fail_on_error: false
          ignore_missing: true
      - replace:
          fields:
            - field: "service.name"
              pattern: "^/?[a-z_]+-"
              replacement: ""
            - field: "service.name"
              pattern: "-[0-9]+$"
              replacement: ""
          ignore_missing: true
          fail_on_error: false

  # Filebeat's own version and the ECS version it claims, on every document.
  # Neither is queried and both are indexed.
  - drop_fields:
      fields: ["agent", "ecs", "input"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["https://elasticsearch:9200"]
  username: "elastic"
  password: "${ELASTICSEARCH_PASSWORD}"
  ssl.certificate_authorities: ["/usr/share/filebeat/certs/ca.crt"]
  # One name, not one per day. This version of Filebeat writes to a data
  # stream, which rolls its own backing indices over by age and size - so a
  # date in the name creates a second data stream every midnight, each of
  # which then has to be found and aged separately. `make logs-retention`
  # sets a retention on the stream once and it holds for every backing
  # index the stream ever creates.
  index: "qa-logs"

# Required once `index` is set: without a template name and pattern Filebeat
# refuses to start, and without ILM disabled it writes to its own managed
# alias instead of the index above.
#
# The pattern has no dash before the star, deliberately: it has to match
# `qa-logs` itself, and `qa-logs-*` does not. It still matches the dated
# streams an earlier version of this file created.
setup.template.name: "qa-logs"
setup.template.pattern: "qa-logs*"
setup.ilm.enabled: false

# Reinstall the template on every start. Without this Filebeat sees a
# template of that name already there and leaves it alone, so an edit to
# this file does nothing at all: the pattern below was changed once and the
# old one stayed, which stopped matching the index being written, which
# left the whole thing to dynamic mapping - `stage` arrived as `text`, and
# the panel grouping on it went quiet. Reinstalling is cheap and happens
# before the first event.
setup.template.overwrite: true

# The fields the application adds beside ECS, so they arrive as something
# aggregatable. Left to dynamic mapping a string becomes `text` with a
# `.keyword` under it, and a Grafana panel grouping by `stage` then finds
# nothing to group on: `text` is analysed and has no doc values.
#
# Only the names ECS does not already define. `error.code`, `url.path`,
# `http.request.method` and `http.response.status_code` are ECS and are
# mapped by the template Filebeat installs.
setup.template.append_fields:
  # Which run wrote the line. Empty for a process that is not one - the
  # api, the frontend, the orchestrator, a make target. The same value
  # Phoenix names its project after, which is what joins the two stores.
  - name: run.id
    type: keyword
  # Which stage wrote the line. The one field every dashboard groups on.
  - name: stage
    type: keyword
  # What the pipeline was working on, bound where the row was claimed.
  - name: document.sha256
    type: keyword
  - name: document.media_type
    type: keyword
  - name: passage.id
    type: long
  - name: passage.block_type
    type: keyword
  - name: topic.id
    type: long
  - name: topic.label
    type: keyword
  - name: topic_fit.id
    type: long
  - name: topic_fit.language
    type: keyword
  - name: upload.filename
    type: keyword
  - name: upload.size_bytes
    type: long
  # A readable passage the model proposed no fact for. One is ordinary; the
  # RATE is the signal, which is why it is a field and not only a message -
  # a run full of them is a model answering empty, and the whole corpus can
  # be marked read with nothing under it without one error being raised.
  - name: extract.nothing_found
    type: boolean
  # One artefact the evaluation phase judged, and what the judge said.
  # `artifact.kind` is what every panel about this phase groups on: the
  # same judgement over a fact and over a question is two measurements.
  - name: artifact.kind
    type: keyword
  - name: artifact.id
    type: long
  - name: assessment.id
    type: long
  - name: assessment.approved
    type: boolean
  - name: assessment.metrics
    type: long
  # A queue verb asked for over HTTP.
  - name: queue.action
    type: keyword
  - name: queue.rows
    type: long
  - name: queue.scope
    type: keyword
  - name: queue.value
    type: keyword
  # One model call. duration_ms is what the latency percentiles read, and the
  # three below are what it was billed as. cost_usd is a double because a
  # single call against a hosted provider costs a fraction of a cent, and a
  # long would floor every one of them to nothing and sum to zero. Absent on
  # a self-hosted model, which litellm has no price for.
  - name: llm.model
    type: keyword
  # Which judgement the call was, and which version of the prompt asked
  # it. The same two the span carries as a tag and as
  # `llm.prompt_template.version`, so a call reads the same either side.
  - name: llm.shape
    type: keyword
  - name: llm.prompt_version
    type: keyword
  - name: llm.duration_ms
    type: long
  - name: llm.tokens.input
    type: long
  - name: llm.tokens.output
    type: long
  - name: llm.cost_usd
    type: double
  # What a stage produced, for the throughput panels.
  - name: facts.stored
    type: long
  - name: facts.validated
    type: long
  - name: facts.rejected
    type: long
  - name: questions.written
    type: long
  - name: questions.threads
    type: long
  - name: questions.accepted
    type: long
  - name: questions.rejected
    type: long
  - name: questions.followups
    type: long

# There is no Kibana in this deployment; Grafana reads the indices directly.
setup.kibana.enabled: false
setup.dashboards.enabled: false

# Filebeat's own logs go to the container's stderr, so `make logs-shipper`
# shows why nothing is arriving when nothing is arriving.
logging.level: info
logging.to_files: false
logging.to_stderr: true

# One page of documents per request, and a bounded wait so a quiet pipeline
# still ships within a few seconds rather than when the batch fills.
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 5s

[project]
name = "qa-generator"
version = "0.0.1"
description = "Generates a verified Q&A reference dataset from documents."
authors = [
    {name = "Hazem Khaled",email = "hazem.mkhaled@icloud.com"}
]
license = {file = "LICENSE"}
# Upper bound: gensim builds against CPython internals removed in 3.14, and
# has no wheel for it. Both images are python:3.13-slim.
requires-python = ">=3.12,<3.14"
dependencies = []


[tool.poetry]
package-mode = false

[dependency-groups]

llm = [
    "litellm>=1.98.0,<2.0.0",
    "instructor>=1.15.4,<2.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "tenacity>=9.1.4,<10.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
]

nlp = [
    "gensim>=4.4.0,<5.0.0",
    "spacy>=3.8.16,<4.0.0",
    "ftfy>=6.3.1,<7.0.0",
    "lingua-language-detector>=2.2.0,<3.0.0",
    "rapidfuzz>=3.14.5,<4.0.0",
    "docling>=2.121.0,<3.0.0",
    "pymupdf>=1.28.2,<2.0.0",
    # Also transitive through docling. Named because question_generation
    # imports it directly for EMBEDDING_MODEL, and a package somebody else
    # pins is a package somebody else may drop.
    "transformers>=5.0.0,<6.0.0",
    # Transitive through docling, named here so the source below can be
    # attached to it. See that block.
    "torch",
    "torchvision",
]

data = [
    "numpy>=2.5.2,<3.0.0",
    "scipy>=1.18.1,<2.0.0",
    "scikit-learn>=1.9.0,<2.0.0",
    "statsmodels>=0.14.6,<1.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pandera>=0.32.1,<1.0.0",
]

storage = [
    "sqlalchemy>=2.0.52,<3.0.0",
    "alembic>=1.16.0,<2.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "pgvector>=0.5.0,<0.6.0",
    "duckdb>=1.5.5,<2.0.0",
    "boto3>=1.43.78,<2.0.0",
]

api = [
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn[standard]>=0.52.4,<1.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "requests>=2.32.5,<3.0.0",
]

pipeline = [
    "dagster>=1.13.19,<2.0.0",
    "dagster-webserver>=1.13.19,<2.0.0",
    "dagster-postgres>=0.29.19,<1.0.0",
    "dagster-dg-cli>=1.13.19,<2.0.0",
]

viz = [
    "matplotlib>=3.11.1,<4.0.0",
    "pyldavis>=3.4.1,<4.0.0",
    "streamlit[pdf]>=1.62.0,<2.0.0",
    "openpyxl>=3.1.5,<4.0.0",
]

observability = [
    # The client side only. Phoenix itself runs as a container, so the server
    # package - with its own web app, database layer and sqlean build - was
    # three hundred megabytes installed to reach a collector over gRPC.
    "opentelemetry-api>=1.44.0,<2.0.0",
    "opentelemetry-sdk>=1.44.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "opentelemetry-instrumentation-botocore>=0.65b0",
    "argilla>=2.8.0,<3.0.0",
]

dev = [
    "pytest>=9.1.1,<10.0.0",
    "hypothesis>=6.165.10,<7.0.0",
    "ruff (>=0.16.0,<1.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pyright (>=1.1.400,<2.0.0)",
    "testcontainers[postgres] (>=4.0.0,<5.0.0)",
    "pip-audit (>=2.7.0,<3.0.0)",
]


# PyTorch's CPU builds. torch arrives through docling and nothing here uses
# a GPU, but the wheel PyPI serves on Linux carries the whole CUDA runtime -
# eighteen nvidia-* packages and some three gigabytes. This is the index the
# image already installs from by hand; explicit, so nothing else is taken
# from it.
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

# Enriching the nlp group declared above: a PEP 735 dependency is a plain
# requirement string and has nowhere to name a source. The split is the
# index's: it serves Linux as `+cpu` and macOS as the plain version.
[tool.poetry.group.nlp.dependencies]
torch = [
    { version = "*", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = "*", markers = "sys_platform != 'linux'" },
]
torchvision = [
    { version = "*", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = "*", markers = "sys_platform != 'linux'" },
]

[tool.ruff]
target-version = "py312"
src = [".", "backend", "frontend"]

[tool.ruff.lint]
extend-select = ["B", "UP", "I", "D"]
ignore = [
    "D107",  # __init__ docstring: the Args are documented on the class
    "D203",  # incompatible with D211, which ruff prefers
    "D213",  # incompatible with D212, which ruff prefers
]

[tool.ruff.lint.per-file-ignores]
# Generated by `alembic revision --autogenerate` and then edited by hand only
# where a trigger or a data backfill needs saying. The column comments come
# from the models and are longer than a line.
"backend/database/migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# The test helpers on pytest's pythonpath, grouped with the third-party
# imports because that is where ruff puts every other one of them.
#
# `topics` is named here and the rest are not, because `make topics-visualise`
# writes ./topics/, and `src` above includes the repository root: on a machine
# where that figure has been drawn ruff calls the import first-party, and
# everywhere else - CI included - third-party. The same file then lints two
# ways depending on whether somebody has run a visualisation.
known-third-party = ["topics"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = [".", "backend", "frontend", "tests", "tests/integration", "tests/frontend"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "nlp: loads a spaCy pipeline",
    "types: shells out to pyright",
    "integration: needs a container runtime",
    "frontend: runs a Streamlit view",
    "e2e: drives the whole pipeline in this process",
    "smoke: builds images and reads the compose file",
    "eval: scores a real served model; never gates",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
include = ["backend", "frontend", "telemetry"]
extraPaths = ["backend"]

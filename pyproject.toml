[project]
name = "qa-generator"
# The one place the version is written. `backend/ingestion/config.py` reads
# it from here and stamps it on every stored object, so there is no second
# copy in an env file to drift from this one.
version = "0.1.0"
description = "Generates a verified Q&A reference dataset from documents."
authors = [
    {name = "Hazem Khaled",email = "hazem.mkhaled@icloud.com"}
]
license = {file = "LICENSE"}
# Upper bound: gensim builds against CPython internals removed in 3.14, and
# has no wheel for it. Both images are python:3.13-slim.
requires-python = ">=3.12,<3.14"
dependencies = []


[tool.poetry]
package-mode = false

[dependency-groups]

llm = [
    "litellm>=1.98.0,<2.0.0",
    "instructor>=1.15.4,<2.0.0",
    # Entra ID tokens for an azure/* model. litellm imports it on that path.
    "azure-identity>=1.19.0,<2.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "tenacity>=9.1.4,<10.0.0",
]

nlp = [
    "gensim>=4.4.0,<5.0.0",
    "spacy>=3.8.16,<4.0.0",
    "lingua-language-detector>=2.2.0,<3.0.0",
    "docling>=2.121.0,<3.0.0",
    "pymupdf>=1.28.2,<2.0.0",
    # Also transitive through docling. Named because question_generation
    # imports it directly for EMBEDDING_MODEL, and a package somebody else
    # pins is a package somebody else may drop.
    "transformers>=5.0.0,<6.0.0",
    # The mean-pool-then-normalise `nlp/embedding.py` used to write out by
    # hand, and the tokenizer window it used to read off the config. One
    # model both stages compare text in.
    # 6.0 renamed `get_sentence_embedding_dimension`, which the width guard
    # reads, so the floor is that rather than 5.
    "sentence-transformers>=6.0.0,<7.0.0",
    # Imported directly by the chunker and the parser, which read a Docling
    # document's own types rather than the converter's. Transitive through
    # docling; named for the reason transformers is.
    "docling-core>=2.0.0,<3.0.0",
    # Transitive through docling, named here so the source below can be
    # attached to it. See that block.
    "torch",
    "torchvision",
]

data = [
    "numpy>=2.5.2,<3.0.0",
    # The frame two first-party modules build directly:
    # `evaluation.second_opinion` hands one to `evaluate_dataframe`, and
    # `question_generation.export` writes the workbook out of one. It was
    # declared under `observability` when only the first of those existed.
    # Transitive through the evals package and through pyLDAvis; named for
    # the reason transformers is - a package somebody else pins is one they
    # may drop.
    "pandas>=2.0.0,<4.0.0",
    # The engine pandas writes an .xlsx through. pandas names it by string
    # and imports nothing, so this would be transitive-only if the export
    # only wrote cells; it also sets the column widths and freezes the
    # headings, which is `openpyxl.styles` and `openpyxl.utils` imported by
    # name. It arrives through docling's own `docling-slim[standard]`
    # extra, which is about as far from this project's control as a pin
    # gets.
    "openpyxl>=3.1.5,<4.0.0",
]

storage = [
    "sqlalchemy>=2.0.52,<3.0.0",
    "alembic>=1.16.0,<2.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "pgvector>=0.5.0,<0.6.0",
    "boto3>=1.43.78,<2.0.0",
    # The S3 error types the bucket client catches by class. Transitive
    # through boto3, named for the reason transformers is.
    "botocore>=1.43.78,<2.0.0",
]

api = [
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn[standard]>=0.52.4,<1.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "requests>=2.32.5,<3.0.0",
]

pipeline = [
    "dagster>=1.13.19,<2.0.0",
    "dagster-webserver>=1.13.19,<2.0.0",
    "dagster-postgres>=0.29.19,<1.0.0",
    "dagster-dg-cli>=1.13.19,<2.0.0",
]

viz = [
    "pyldavis>=3.4.1,<4.0.0",
    "streamlit[pdf]>=1.62.0,<2.0.0",
]

observability = [
    # The client side only. Phoenix itself runs as a container, so the server
    # package - with its own web app, database layer and sqlean build - was
    # three hundred megabytes installed to reach a collector over gRPC.
    #
    # The client is here for the golden-set experiments in evaluation/, which
    # need the datasets and experiments API and nothing else.
    "opentelemetry-api>=1.44.0,<2.0.0",
    "opentelemetry-sdk>=1.44.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2.0.0",
    # The ONE instrumentor this project applies, and `telemetry/traces.py`
    # says why it is the one: Phoenix holds the logic, and an HTTP request,
    # an S3 GET and a request handler are the system, which is what the
    # logs are for. It is applied by name, off TRACE_DATABASE, and only
    # while somebody is reading it.
    #
    # The fastapi, requests and botocore instrumentors were declared here
    # and in three requirements files and NOTHING imported any of them -
    # the `_INSTRUMENTORS` table that once applied them is gone, and no
    # image runs under `opentelemetry-instrument`. deptry could not see it:
    # all four ship the top-level name `opentelemetry`, so the
    # `import opentelemetry` in traces.py satisfies every one of them.
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    # Turns a litellm call into a span carrying the prompt, the completion
    # and the token counts. Without it Phoenix shows an `extract` span with
    # no model detail at all, which is a trace viewer and not LLM
    # observability.
    "openinference-instrumentation-litellm (>=0.1.45,<0.2.0)",
    "argilla>=2.8.0,<3.0.0",
    "arize-phoenix-client (>=3.5.0,<4.0.0)",
    # The judge scaffolding `phrasing.py` writes out per judgement: a prompt,
    # a classification, retries and concurrency. Used in evaluation/ only, as
    # a SECOND opinion recorded beside the checker's verdict and never as a
    # gate - see evaluation/README.md on why a model's answers cannot gate.
    "arize-phoenix-evals (>=2.0.0,<3.0.0)",
]

dev = [
    "pytest>=9.1.1,<10.0.0",
    "hypothesis>=6.165.10,<7.0.0",
    "ruff (>=0.16.0,<1.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pyright (>=1.1.400,<2.0.0)",
    "testcontainers[postgres] (>=4.0.0,<5.0.0)",
    "pip-audit (>=2.7.0,<3.0.0)",
    # A declared dependency nothing imports. Five were found the first time
    # this ran - pandera, rapidfuzz, scipy, statsmodels and ftfy - and one of
    # them was also in backend/api/requirements.txt, so it shipped.
    "deptry (>=0.23.0,<1.0.0)",
    # The two architecture rules the root README states, as contracts rather
    # than as prose. See .importlinter.
    "import-linter (>=2.0,<3.0)",
    # Generates the contract cases from the committed openapi.json.
    "schemathesis (>=4.0.0,<5.0.0)",
    # Shuffles the order every run. The container fixtures are session-scoped
    # and `application` writes to os.environ rather than through monkeypatch,
    # so order-coupling here is a real risk and was previously invisible.
    "pytest-randomly (>=3.15.0,<4.0.0)",
    # The unit layer over every core. Not for the integration layer, which
    # shares one Postgres and one bucket.
    "pytest-xdist (>=3.6.0,<4.0.0)",
    # The documented ceilings, as a test rather than as a comment: `adds_up`
    # is O(n^4) over a capped list and the boilerplate probe is one k-NN per
    # passage.
    "pytest-benchmark (>=5.1.0,<6.0.0)",
    # Whether the gate tests would notice a gate changing. Line coverage says
    # the line ran; this says flipping it fails something. Nightly, never a
    # pull-request gate.
    "mutmut (>=3.2.0,<4.0.0)",
    # What `starlette.testclient` imports. It tries httpx2 first and falls
    # back to httpx with a StarletteDeprecationWarning, so without this the
    # every-warning-is-an-error rule below has to carry an ignore for a
    # deprecation the project can simply not have. Nothing here imports it
    # by name: TestClient does.
    #
    # Not a move off httpx onto `requests`, which is not on offer -
    # starlette's TestClient dropped requests in 0.21. The first-party HTTP
    # in frontend/lib/backend and orchestration/client.py is requests, and
    # stays requests.
    "httpx2 (>=2.12.0,<3.0.0)",
]


# Every group but `dev` holds requirements the deployment runs on. Naming
# them is not optional: the `[tool.poetry.source]` block below - which exists
# only to point torch at the CPU index - puts deptry in Poetry mode, and in
# that mode every PEP 735 group is read as development-only. Unnamed, the
# runtime imports all report as DEP004 and the unused runtime declarations
# report as nothing at all, which is the half worth having.
[tool.deptry]
non_dev_dependency_groups = [
    "llm",
    "nlp",
    "data",
    "storage",
    "api",
    "pipeline",
    "viz",
    "observability",
]
known_first_party = [
    "api",
    "archive",
    "assessment",
    "blob_store",
    # A module rather than a package, and first-party all the same: five
    # backend modules import it and deptry read every one as a missing
    # dependency.
    "confidence",
    "database",
    "drivers",
    "evaluation",
    "extraction",
    "factories",
    "ingestion",
    "lib",
    "llm",
    "nlp",
    "orchestration",
    "pages",
    "preprocessing",
    "question_generation",
    "review",
    "seed",
    "settings",
    "stages",
    "telemetry",
    "topic_modelling",
    "views",
]

[tool.deptry.per_rule_ignores]
# DEP002: declared and never imported, and right to be. Everything not on
# this list that deptry reported has been deleted rather than excused.
DEP002 = [
    # A command line and a server, not an import: `dagster dev` reads
    # orchestration/definitions.py, the webserver serves it, and
    # dagster-postgres is named in orchestration/requirements.txt as the
    # storage the run reads and writes through its own configuration.
    "dagster-webserver",
    "dagster-dg-cli",
    "dagster-postgres",
    # uvicorn runs the api as a process; the api never imports it.
    "uvicorn",
    # FastAPI parses a multipart upload through it and imports it itself.
    # Absent, `POST /documents` fails at request time rather than at start-up.
    "python-multipart",
    # litellm imports it on the azure/* path, by name, at call time.
    "azure-identity",
    # The wheels the CPU index serves. torch arrives through docling and
    # torchvision through torch; both are named so the source below can be
    # attached to them.
    "torch",
    "torchvision",
    # SQLAlchemy dials out through psycopg's binary build; nothing imports it.
    "psycopg",
    # The tools the Makefile and CI shell out to.
    "pytest-cov",
    "ruff",
    "pyright",
    "pip-audit",
    "deptry",
    "import-linter",
    "schemathesis",
    "mutmut",
    # pytest plugins. Loaded by entry point, so nothing imports them.
    "pytest-randomly",
    "pytest-xdist",
    "pytest-benchmark",
]


# PyTorch's CPU builds. torch arrives through docling and nothing here uses
# a GPU, but the wheel PyPI serves on Linux carries the whole CUDA runtime -
# eighteen nvidia-* packages and some three gigabytes. This is the index the
# image already installs from by hand; explicit, so nothing else is taken
# from it.
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

# Enriching the nlp group declared above: a PEP 735 dependency is a plain
# requirement string and has nowhere to name a source. The split is the
# index's: it serves Linux as `+cpu` and macOS as the plain version.
[tool.poetry.group.nlp.dependencies]
torch = [
    { version = "*", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = "*", markers = "sys_platform != 'linux'" },
]
torchvision = [
    { version = "*", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = "*", markers = "sys_platform != 'linux'" },
]

[tool.ruff]
target-version = "py312"
src = [".", "backend", "frontend"]

[tool.ruff.lint]
extend-select = ["B", "UP", "I", "D"]
ignore = [
    "D107",  # __init__ docstring: the Args are documented on the class
    "D203",  # incompatible with D211, which ruff prefers
    "D213",  # incompatible with D212, which ruff prefers
]

[tool.ruff.lint.per-file-ignores]
# Generated by `alembic revision --autogenerate` and then edited by hand only
# where a trigger or a data backfill needs saying. The column comments come
# from the models and are longer than a line.
"backend/database/migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# The test helpers on pytest's pythonpath, grouped with the third-party
# imports because that is where ruff puts every other one of them.
#
# `topics` is named here and the rest are not, because `make topics-visualise`
# writes ./topics/, and `src` above includes the repository root: on a machine
# where that figure has been drawn ruff calls the import first-party, and
# everywhere else - CI included - third-party. The same file then lints two
# ways depending on whether somebody has run a visualisation.
known-third-party = ["topics"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = [".", "backend", "frontend", "tests", "tests/integration", "tests/frontend"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    # Was "loads a spaCy pipeline", which left the embedder's 2.2 GB of
    # weights outside the only marker that would have excluded them.
    "nlp: loads a spaCy pipeline or a sentence-transformer",
    "types: shells out to pyright",
    "integration: needs a container runtime",
    "frontend: runs a Streamlit view",
    "e2e: drives the whole pipeline in this process",
    "smoke: builds images and reads the compose file",
    "eval: scores a real served model; never gates",
    "perf: times the ceilings the code names; never gates",
]

# A deprecation nothing fails on is a deprecation nobody reads. The
# StarletteDeprecationWarning about httpx sat in every run's summary until
# somebody went looking for it; `error` is what would have surfaced it on
# the commit that introduced it.
#
# Every ignore below is third-party and unfixable from here, and each is
# pinned to the module that raises it rather than to the category, so the
# same category from OUR code still fails. Delete one and see whether it
# still fires: that is how they leave.
filterwarnings = [
    "error",
    # starlette/testclient.py reads `anyio.abc.BlockingPortal` to build a
    # type alias. Fixed upstream in starlette's own time, not ours.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # The SWIG runtime types pymupdf's C extension registers. Python 3.13
    # wants a __module__ on a builtin type and SWIG does not set one.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    # The anyio stream pair schemathesis's ASGI transport opens per generated
    # call and does not close; it surfaces at collection as an unraisable.
    # Named by the stream rather than by the category, because the category
    # is also what a leaked psycopg connection raises - which was a real
    # defect in tests/conftest.py and has to keep failing.
    "ignore:Unclosed <MemoryObject(Receive|Send)Stream:ResourceWarning",
]

# Measured over every package a deployment runs, not just the backend: the
# frontend, the orchestrator, the review tool and the golden-set runner were
# outside the figure entirely, so nothing said whether they were tested.
#
# `parallel` and `relative_files` are what let the unit job and the
# integration job be combined: neither covers the other's half - the
# repositories are the integration layer's and the gates are the unit
# layer's - so a threshold against either alone is a threshold against the
# wrong number.
[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["backend", "frontend", "telemetry", "orchestration", "review", "evaluation"]
omit = [
    # Generated by alembic and run once against a real database. The
    # integration layer migrates with them, which exercises `upgrade` and
    # never `downgrade`, so the figure they contribute is noise.
    "backend/database/migrations/*",
]

[tool.coverage.paths]
# One name per package, so a path measured in the unit job and the same path
# measured in the integration job combine rather than being counted twice.
source = ["backend", "frontend", "telemetry", "orchestration", "review", "evaluation"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured at 92% over the combined layers. Two points of headroom, so an
# ordinary refactor does not trip it and a stage losing its tests does.
# A floor, not a target: raise it when a change takes the figure up.
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "class .*\\(Protocol\\):",
]

# Whether a test would notice a gate changing. Scoped to the modules that
# ARE the product: the gates, the sampling and the release draw are rules
# and arithmetic, which is what a mutant can meaningfully change. A mutant
# in a repository is a mutant in a query that needs a database, and one in
# a prompt is a string nothing asserts on.
#
# `make mutation` runs it and it is never a pull-request gate: it takes
# hours and its number is a measurement, not a threshold.
[tool.mutmut]
source_paths = [
    "backend/question_generation/gates.py",
    "backend/question_generation/balance.py",
    "backend/question_generation/selection.py",
    "backend/question_generation/models.py",
    "backend/question_generation/planning.py",
    "backend/extraction/validation.py",
]
# The layers that need no container and no model. A mutant surviving
# because the only test that would catch it was skipped is a false result.
pytest_add_cli_args = [
    "-m",
    "not integration and not smoke and not eval and not perf and not types",
    "-p",
    "no:randomly",
]
mutate_only_covered_lines = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
include = ["backend", "frontend", "telemetry", "orchestration", "review", "evaluation"]
extraPaths = ["backend"]

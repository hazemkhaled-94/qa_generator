# Alembic configuration.
#
# The migrations live under backend/database/ beside the models they are
# generated from. DATABASE_URL is read from the environment in env.py, not
# set here: there is one source of configuration and it is .env.

[alembic]
script_location = backend/database/migrations
prepend_sys_path = backend
path_separator = os

# A revision is named by its date and its message, so `ls versions/` reads
# as a history rather than as a list of hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
